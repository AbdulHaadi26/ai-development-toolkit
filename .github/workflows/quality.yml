name: Toolkit quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Check formatting
        run: npx --yes prettier@3.6.2 --check .
      - name: Test workflow toolkit commands
        run: node workflow-kit/scripts/workflow-kit.test.mjs
